name: stayhub_mobile
description: StayHub mobile app - Flutter Android/iOS client for C# microservices.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.7.0
  get_storage: ^2.1.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.2
  mobile_scanner: ^6.0.2
  signalr_netcore: ^1.4.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  permission_handler: ^12.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  app_links: 6.2.0
  camera: ^0.12.0+1
  flutter_map_heatmap: ^0.0.8  # MỚI - lớp Heatmap


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/stayhub_icon_transparent.png
    - assets/images/
    - assets/icons/
